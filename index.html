<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="爬宠管家">
<title>爬宠管家</title>
<!-- 内联 SVG 图标：本地 file:// 打开时也能显示 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ccircle cx='23' cy='27' r='4' fill='%23fff'/%3E%3Ccircle cx='41' cy='27' r='4' fill='%23fff'/%3E%3Cpath d='M18 42c6 6 22 6 28 0' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- PWA：部署到 https 后生效，本地打开时缺失会自动忽略，不影响使用 -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#fff; --fg:#111; --fg2:#666; --fg3:#9a9a9a;
  --line:#ececec; --line2:#f5f5f5; --fill:#f6f6f6;
  --warn:#c0392b; --ok:#2f7a4f;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,select,textarea{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 0;background:transparent;outline:none;border-radius:0}
input:focus,select:focus,textarea:focus{border-bottom-color:var(--fg)}
textarea{resize:none;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px}
select{appearance:none;-webkit-appearance:none;background:transparent}
.hidden{display:none!important}

/* ------- 布局 ------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.page{padding:0 20px 110px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hd{padding:max(22px,env(safe-area-inset-top)) 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd h1{font-size:25px;font-weight:600;margin:0;letter-spacing:-.4px}
.hd .sub{font-size:12px;color:var(--fg3)}

/* ------- 底部导航 ------- */
#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
#tabbar .in{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--fg3);font-size:10.5px}
.tab.on{color:var(--fg)}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ------- 通用组件 ------- */
.card{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-t{font-size:12px;color:var(--fg3);letter-spacing:.6px;margin:24px 0 10px;text-transform:uppercase}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--fg3)}
.small{font-size:12.5px}
.btn{display:block;width:100%;background:var(--fg);color:#fff;text-align:center;padding:13px;border-radius:12px;font-size:15px;font-weight:500}
.btn:active{opacity:.82}
.btn.gh{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.dg{background:transparent;color:var(--warn);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border-radius:20px;background:var(--fill);color:var(--fg2)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:7px 14px;border-radius:20px;border:1px solid var(--line);font-size:13px;color:var(--fg2)}
.seg button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.empty{text-align:center;color:var(--fg3);padding:34px 10px;font-size:13.5px;line-height:1.9}

/* 宠物切换条 */
.pswitch{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.pswitch::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border:1px solid var(--line);border-radius:22px}
.pchip.on{border-color:var(--fg);background:var(--fg);color:#fff}
.pchip .av{width:26px;height:26px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden;flex:0 0 auto}
.pchip.on .av{background:rgba(255,255,255,.22)}
.pchip .av img{width:100%;height:100%;object-fit:cover}
.pchip .nm{font-size:14px;white-space:nowrap}
.pchip .meta{font-size:11px;color:var(--fg3);white-space:nowrap}
.pchip.on .meta{color:rgba(255,255,255,.7)}

/* 概览数字 */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.5px}
.kpi .v small{font-size:12px;font-weight:400;color:var(--fg3);margin-left:2px}
.kpi .l{font-size:11.5px;color:var(--fg3);margin-top:3px}
.kpi.alert{border-color:var(--warn)}
.kpi.alert .v{color:var(--warn)}

/* 记录流 */
.day{margin:0 0 6px;padding:16px 0 4px;font-size:12px;color:var(--fg3);letter-spacing:.5px}
.rec{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.rec:last-child{border-bottom:0}
.rec .ic{width:32px;height:32px;border-radius:10px;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.rec .bd{flex:1;min-width:0}
.rec .t1{font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec .t2{font-size:12.5px;color:var(--fg2);margin-top:2px;word-break:break-word}
.rec .t2.note{color:var(--fg3);font-style:normal}
.rec .tm{font-size:11.5px;color:var(--fg3);flex:0 0 auto;padding-top:2px}
.rec .del{color:var(--fg3);font-size:18px;padding:0 2px;flex:0 0 auto;line-height:1}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--fill);color:var(--fg2);font-weight:400}
.tag.no{background:#fdecea;color:var(--warn)}

/* 表单 —— 注意：隐藏态必须 pointer-events:none，否则全屏遮罩会吃掉所有点击 */
.sheet-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .2s ease, visibility .2s ease;
}
.sheet-bg.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;
  border-radius:18px 18px 0 0;max-width:520px;margin:0 auto;
  transform:translateY(100%);pointer-events:none;
  transition:transform .24s cubic-bezier(.3,.9,.3,1);
  max-height:88vh;overflow-y:auto;padding:8px 20px calc(24px + var(--safe-b));
}
.sheet.show{transform:none;pointer-events:auto}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--fg3);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 4px}
.typegrid button{border:1px solid var(--line);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--fg2)}
.typegrid button.on{border-color:var(--fg);background:var(--fg);color:#fff}
.typegrid .e{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chips button{padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:13px;color:var(--fg2)}
.chips button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:130px}
.stepper button{width:40px;height:38px;font-size:17px;color:var(--fg2)}
.stepper input{text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:9px 0}

/* 图表 */
.chart-wrap{overflow-x:auto;scrollbar-width:none}
.chart-wrap::-webkit-scrollbar{display:none}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;justify-content:start;margin:4px 0 8px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--fill);display:block}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--fg3)}
.legend i{width:11px;height:11px;border-radius:2px;display:block}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:4px}

/* 错误提示条 */
#errbar{
  position:fixed;left:0;right:0;top:0;z-index:90;background:var(--warn);color:#fff;
  font-size:12.5px;padding:10px 16px;line-height:1.6;display:none;word-break:break-all;
}
/* PC 端：显示为居中的手机框 */
@media (min-width:600px){
  body{background:#efefef}
  #app{box-shadow:0 0 0 1px #e5e5e5}
  #tabbar{background:transparent;border-top:0}
  #tabbar .in{background:rgba(255,255,255,.96);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="app">
  <div id="view"></div>
</div>

<div id="tabbar"><div class="in">
  <button class="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg><span>首页</span></button>
  <button class="tab" data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg><span>记录</span></button>
  <button class="tab" data-tab="stat"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg><span>统计</span></button>
  <button class="tab" data-tab="mine"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span>我的</span></button>
</div></div>

<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetbody"></div></div>

<script>
/* =========================================================
   爬宠管家 — 单文件本地应用
   数据全部保存在浏览器 localStorage，不联网
   ========================================================= */
(function(){
'use strict';

var KEY = 'reptile_care_v1';
var META_KEY = 'reptile_care_v1_meta';
var LS_OK = true;                 // localStorage 是否可用（隐私模式下可能不可用）
var S = { pets:[], records:[] };
var META = { lastBackupAt:0 };
/* 存储状态（异步填充） */
var ST = { persisted:false, canPersist:false,
  persistText:'检测中…', usageText:'计算中…', usageBytes:0, quotaBytes:0 };
var UI = { tab:'home', petId:null, logFilter:'all', statPet:null, statMode:'weight' };
var form = {};   // 记录表单草稿
var petForm = {};// 宠物表单草稿

/* ---------- 常量 ---------- */
var TYPES = [
  {k:'feed',   e:'🍽', n:'喂食', u:'喂食'},
  {k:'weight', e:'⚖️', n:'称重', u:'称重'},
  {k:'shed',   e:'🌀', n:'蜕皮', u:'蜕皮'},
  {k:'poop',   e:'💧', n:'排泄', u:'排泄'},
  {k:'health', e:'🩺', n:'健康', u:'健康'},
  {k:'env',    e:'🌡', n:'环境', u:'环境'},
  {k:'breed',  e:'🥚', n:'繁殖', u:'繁殖'},
  {k:'note',   e:'📝', n:'备注', u:'备注'}
];
var TYPE_MAP = {}; TYPES.forEach(function(t){TYPE_MAP[t.k]=t;});

var SPECIES = ['睫角守宫','豹纹守宫','玉米蛇','球蟒','鬃狮蜥','蓝舌石龙子','角蛙','苏卡达陆龟','捕鸟蛛','其他'];
var FOOD_BY_SPECIES = {
  '睫角守宫':['果泥 CGD','蟋蟀','杜比亚','面包虫','樱桃蟑螂','其他'],
  '豹纹守宫':['蟋蟀','杜比亚','面包虫','大麦虫','其他'],
  '玉米蛇':['乳鼠·粉皮','乳鼠·小白','乳鼠·白霜','乳鼠·亚成','乳鼠·成鼠','其他'],
  '球蟒':['乳鼠·小白','乳鼠·白霜','乳鼠·亚成','乳鼠·成鼠','其他'],
  '鬃狮蜥':['蟋蟀','杜比亚','面包虫','油麦菜','其他'],
  '蓝舌石龙子':['狗粮','蜗牛','蔬菜','蓝舌粮','其他'],
  '角蛙':['蟋蟀','杜比亚','乳鼠·粉皮','角蛙粮','其他'],
  '苏卡达陆龟':['油麦菜','牧草','龟粮','蒲公英','其他'],
  '捕鸟蛛':['蟋蟀','杜比亚','面包虫','其他']
};
var DEF_INTERVAL = {'睫角守宫':3,'豹纹守宫':3,'玉米蛇':7,'球蟒':10,'鬃狮蜥':2,'蓝舌石龙子':3,'角蛙':5,'苏卡达陆龟':1,'捕鸟蛛':7};

/* 进食情况：内部值 <-> 中文 */
var EATEN_CN = ['全部吃完','基本吃完','少量进食','拒食'];
var EATEN_TO_CN = {yes:'全部吃完', mostly:'基本吃完', partial:'少量进食', no:'拒食'};
var CN_TO_EATEN = {'全部吃完':'yes', '基本吃完':'mostly', '少量进食':'partial', '拒食':'no'};

/* 某只宠物可选的食物列表（物种推荐 + 常见兜底） */
function foodList(p){
  var foods = (p && FOOD_BY_SPECIES[p.species]) || FOOD_BY_SPECIES['其他'] || ['其他'];
  var all = foods.slice();
  ['蟋蟀','杜比亚','面包虫','其他'].forEach(function(x){ if(all.indexOf(x)<0) all.push(x); });
  return all;
}

/* ---------- 工具 ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return n<10?'0'+n:''+n;}
function today(){return ymd(new Date());}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function days(s){return Math.floor((parseD(today())-parseD(s))/86400000);}
function diffDays(a,b){return Math.floor((parseD(b)-parseD(a))/86400000);}
function fmtMD(s){var p=s.split('-');return (+p[1])+'/'+(+p[2]);}
function fmtDateCN(s){var p=s.split('-');return p[0]+'年'+(+p[1])+'月'+(+p[2])+'日';}
function weekday(s){return '日一二三四五六'[parseD(s).getDay()];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(v);return isNaN(n)?null:n;}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}

/* ---------- 存取 ---------- */
function showErr(msg){
  var b = document.getElementById('errbar');
  if(!b) return;
  b.style.display = 'block';
  b.textContent = '⚠ ' + msg;
  document.body.style.paddingTop = '46px';   // 避免错误条盖住页面标题
}
function load(){
  try{ localStorage.setItem(KEY+'__t','1'); localStorage.removeItem(KEY+'__t'); }
  catch(e){ LS_OK = false; }
  loadMeta();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var d = JSON.parse(raw);
      S.pets = d.pets||[]; S.records = d.records||[];
    }
  }catch(e){ showErr('读取本地数据失败：'+e.message); }
  if(!LS_OK && !S.pets.length){
    showErr('当前浏览器禁用了本地存储（可能是隐私/无痕模式），本次记录不会被保存。请换普通窗口打开，或随时用「导出备份」保存数据。');
  }
  if(!S.pets.length){
    S.pets = [
      {id:uid(),name:'睫角守宫',species:'睫角守宫',morph:'',gender:'未知',birth:'',acquire:today(),avatar:'',interval:DEF_INTERVAL['睫角守宫']||3,createdAt:Date.now()},
      {id:uid(),name:'玉米蛇',species:'玉米蛇',morph:'',gender:'未知',birth:'',acquire:today(),avatar:'',interval:DEF_INTERVAL['玉米蛇']||7,createdAt:Date.now()}
    ];
    save();
  }
  if(!UI.petId || !getPet(UI.petId)) UI.petId = S.pets[0].id;
}
function save(){
  if(!LS_OK) return;
  try{ localStorage.setItem(KEY, JSON.stringify({version:1,pets:S.pets,records:S.records})); }
  catch(e){ alert('保存失败：'+e.message+'。可能是存储空间已满，请先导出备份。'); }
}

/* ---------- 备份状态 ---------- */
function loadMeta(){
  try{
    var raw = localStorage.getItem(META_KEY);
    if(raw) META = JSON.parse(raw) || {};
  }catch(e){}
  if(!META.lastBackupAt) META.lastBackupAt = 0;
}
function saveMeta(){
  if(!LS_OK) return;
  try{ localStorage.setItem(META_KEY, JSON.stringify(META)); }catch(e){}
}
function markBackedUp(){ META.lastBackupAt = Date.now(); saveMeta(); }
function daysSinceBackup(){
  if(!META.lastBackupAt) return null;
  return Math.floor((Date.now()-META.lastBackupAt)/86400000);
}
/* 是否需要提醒备份，以及提醒文案 */
function backupStatus(){
  var n = S.records.length;
  if(n < 3) return { need:false, text:'暂无记录', msg:'' };
  var d = daysSinceBackup();
  if(d === null){
    return { need:true, text:'从未备份', msg:'已记 '+n+' 条，还没备份过' };
  }
  var t = d===0 ? '今天' : (d===1?'昨天' : d+' 天前');
  if(d >= 14) return { need:true, text:t, msg:'距上次备份已 '+d+' 天' };
  return { need:false, text:t, msg:'' };
}

/* ---------- 持久化存储 ----------
   persist() 让浏览器把本站数据标记为"持久化"，
   手机存储紧张时不会优先清除它。Chrome / Edge / Android 支持。 */
function initStorageGuard(){
  if(!navigator.storage || !navigator.storage.persist){
    ST.canPersist = false;
    ST.persistText = '当前浏览器不支持';
    return;
  }
  ST.canPersist = true;
  navigator.storage.persisted().then(function(has){
    ST.persisted = has;
    if(has){ ST.persistText = '已开启 ✓'; refreshMine(); return; }
    // 未开启时自动申请一次（装到桌面的应用通常会被批准）
    return navigator.storage.persist().then(function(ok){
      ST.persisted = ok;
      ST.persistText = ok ? '已开启 ✓' : '未开启（系统未批准）';
      refreshMine();
    });
  }).catch(function(){
    ST.persistText = '状态未知';
  });
  if(navigator.storage.estimate){
    navigator.storage.estimate().then(function(est){
      ST.usageBytes = est.usage || 0;
      ST.quotaBytes = est.quota || 0;
      ST.usageText = fmtBytes(ST.usageBytes) + (ST.quotaBytes ? ' / 可用 ' + fmtBytes(ST.quotaBytes) : '');
      refreshMine();
    }).catch(function(){ ST.usageText = '未知'; });
  }else{ ST.usageText = '未知'; }
}
function fmtBytes(b){
  if(!b) return '0 KB';
  if(b < 1024) return b + ' B';
  if(b < 1024*1024) return (b/1024).toFixed(0) + ' KB';
  return (b/1024/1024).toFixed(2) + ' MB';
}
/* 存储信息是异步拿到的，拿到后只刷新「我的」页，避免打断当前操作 */
function refreshMine(){
  if(UI.tab === 'mine') render();
}
function getPet(id){for(var i=0;i<S.pets.length;i++)if(S.pets[i].id===id)return S.pets[i];return null;}
function petRecords(id,type){
  return S.records.filter(function(r){return r.petId===id && (type?r.type===type:true);})
                  .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.createdAt<b.createdAt?1:-1);});
}
function lastRec(id,type){var r=petRecords(id,type);return r[0]||null;}
function petAge(p){
  if(!p.birth) return null;
  var d = days(p.birth); if(d<0) return null;
  if(d<60) return d+' 天';
  if(d<730) return Math.floor(d/30.4)+' 个月';
  return (d/365).toFixed(1)+' 岁';
}

function delta(d){

}

  else{

      h += recRow(r);
    });

function recRow(r){
  var t = TYPE_MAP[r.type]||{e:'•',n:'记录'};
  var h = '<div class="rec">';
  h += '<div class="ic">'+t.e+'</div>';
  h += '<div class="bd"><div class="t1">'+esc(recTitle(r))+'</div>';
  if(recSub(r)) h += '<div class="t2">'+recSub(r)+'</div>';
  if(r.note) h += '<div class="t2 note">'+esc(r.note)+'</div>';
  h += '</div>';
  h += '<div class="tm">'+esc(r.time||'')+'</div>';
  h += '<button class="del" data-act="delrec" data-id="'+r.id+'">×</button>';
  h += '</div>';
  return h;
}
function recTitle(r){
  var v=r.v||{};
  if(r.type==='feed'){
    var s = v.food||'喂食';
    if(v.size) s += ' · '+v.size;
    return s;
  }
  if(r.type==='weight') return (v.weight!=null?v.weight+' g':'称重') + (v.svl?' · SVL '+v.svl+' cm':'');
  if(r.type==='shed') return '蜕皮'+(v.complete==='no'?' · 不完整':(v.complete==='yes'?' · 完整':''));
  if(r.type==='poop') return ({feces:'排便',urate:'尿酸',both:'排便+尿酸',none:'未排泄'})[v.kind]||'排泄';
  if(r.type==='health') return v.symptom||'健康记录';
  if(r.type==='env') return [v.hot?'热点 '+v.hot+'℃':null, v.cool?'冷区 '+v.cool+'℃':null, v.humidity?'湿度 '+v.humidity+'%':null].filter(Boolean).join(' · ')||'环境记录';
  if(r.type==='breed') return v.event||'繁殖记录';
  return v.text||'备注';
}
function recSub(r){
  var v=r.v||{}, out=[];
  if(r.type==='feed'){
    if(v.eaten==='no') out.push('<span class="tag no">拒食</span>');
    else if(v.eaten==='partial') out.push('<span class="tag">少量进食</span>');
    else if(v.eaten==='mostly') out.push('<span class="tag">基本吃完</span>');
    if(v.sup&&v.sup.length) out.push('<span class="tag">'+v.sup.join('+')+'</span>');
  }
  if(r.type==='shed'&&v.complete==='no') out.push('<span class="tag no">有残留</span>');
  if(r.type==='poop'&&v.normal==='no') out.push('<span class="tag no">形态异常</span>');
  if(r.type==='health'){ if(v.vet) out.push('<span class="tag">就医</span>'); if(v.medicine) out.push('<span class="tag">'+esc(v.medicine)+'</span>'); }
  return out.join(' ');
}

function lineChart(rows, mode){
  var pts = rows.filter(function(r){return r.v[mode]!=null;}).map(function(r){return {x:r.date,y:r.v[mode]};});
  if(pts.length<2) return '<div class="empty">至少需要 2 条'+(mode==='weight'?'体重':'体长')+'记录才能画曲线。</div>';
  var W=320,H=170,PL=38,PR=10,PT=14,PB=26;
  var ys = pts.map(function(p){return p.y;});
  var mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys);
  if(mn===mx){ mn = mn-1; mx = mx+1; }
  var padv = (mx-mn)*0.12; mn-=padv; mx+=padv;
  var X = function(i){return PL + i*(W-PL-PR)/(pts.length-1);};
  var Y = function(v){return PT + (1-(v-mn)/(mx-mn))*(H-PT-PB);};
  var s = '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:170px;display:block">';
  for(var g=0;g<=3;g++){
    var vy = PT + g*(H-PT-PB)/3, vv = mx - g*(mx-mn)/3;
    s += '<line x1="'+PL+'" y1="'+vy+'" x2="'+(W-PR)+'" y2="'+vy+'" stroke="#f0f0f0" stroke-width="1"/>';
    s += '<text x="'+(PL-6)+'" y="'+(vy+3.5)+'" font-size="9" fill="#9a9a9a" text-anchor="end">'+(vv>=100?vv.toFixed(0):vv.toFixed(1))+'</text>';
  }
  var d = pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1);}).join(' ');
  s += '<path d="'+d+'" fill="none" stroke="#111" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.6" fill="#fff" stroke="#111" stroke-width="1.4"/>';
    if(i===pts.length-1) s += '<text x="'+X(i).toFixed(1)+'" y="'+(Y(p.y)-8)+'" font-size="9.5" fill="#111" text-anchor="end" font-weight="600">'+p.y+'</text>';
  });
  [0, Math.floor((pts.length-1)/2), pts.length-1].forEach(function(i,k){
    if(k===1 && i===0) return;
    var an = i===0?'start':(i===pts.length-1?'end':'middle');
    s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#9a9a9a" text-anchor="'+an+'">'+fmtMD(pts[i].x)+'</text>';
  });
  s += '</svg></div>';
  return s;
}
function heatmap(fs){
  var map = {};
  fs.forEach(function(r){ map[r.date]=(map[r.date]||0)+1; });
  var end = parseD(today());
  var start = new Date(end.getTime() - (12*7-1)*86400000);
  start.setDate(start.getDate() - start.getDay()); // 对齐到周日，保证每列是一整周
  var total = Math.round((end-start)/86400000)+1;
  var cnt = 0;
  var h = '<div class="heat">';
  for(var i=0;i<total;i++){
    var d = new Date(start.getTime()+i*86400000), ds = ymd(d);
    var c = map[ds]||0; if(c) cnt++;
    var bg = c===0?'#f2f2f2':(c===1?'#b9b9b9':'#111');
    h += '<i style="background:'+bg+'" title="'+ds+'"></i>';
  }
  h += '</div><div class="row"><span class="legend">少 <i style="background:#f2f2f2"></i><i style="background:#b9b9b9"></i><i style="background:#111"></i> 多</span><span class="legend">区间内共 '+cnt+' 天有喂食</span></div>';
  return h;
}
function foodBars(fs){
  if(!fs.length) return '<div class="empty">近 30 天没有喂食记录。</div>';
  var m={};
  fs.forEach(function(r){ var k=r.v.food||'未记录'; m[k]=(m[k]||0)+1; });
  var arr = Object.keys(m).map(function(k){return {k:k,v:m[k]};}).sort(function(a,b){return b.v-a.v;});
  var mx = arr[0].v;
  return arr.map(function(o){
    return '<div style="margin-bottom:11px"><div class="row small" style="margin-bottom:5px"><span>'+esc(o.k)+'</span><span class="muted">'+o.v+' 次</span></div>'
      + '<div class="bar"><i style="width:'+Math.max(6,o.v/mx*100)+'%"></i></div></div>';
  }).join('');
}

/* =========================================================
   交互绑定
   ========================================================= */
function bind(){
  $$('#tabbar .tab').forEach(function(b){
    b.onclick = function(){ UI.tab = b.dataset.tab; render(); };
  });
  $$('[data-act]').forEach(function(el){
    el.onclick = function(){ act(el.dataset.act, el.dataset); };
  });
}
function act(a, d){
  if(a==='switch'){ UI.petId=d.id; render(); }
  else if(a==='gopet'){ UI.tab='mine'; render(); }
  else if(a==='filter'){ UI.logFilter=d.f; render(); }
  else if(a==='statpet'){ UI.statPet=d.id; render(); }
  else if(a==='statmode'){ UI.statMode=d.m; render(); }
  else if(a==='delrec'){
    if(!confirm('删除这条记录？')) return;
    S.records = S.records.filter(function(r){return r.id!==d.id;}); save(); render();
  }
  else if(a==='add'){ openForm(null); }
  else if(a==='quickfeed'){ openForm('feed'); }
  else if(a==='newpet'){ openPet(null); }
  else if(a==='editpet'){ openPet(d.id); }
  else if(a==='exportjson'){ exportJSON(); }
  else if(a==='persist'){
    if(!navigator.storage || !navigator.storage.persist){ alert('当前浏览器不支持持久化存储，请定期导出备份。'); return; }
    navigator.storage.persist().then(function(ok){
      ST.persisted = ok;
      ST.persistText = ok ? '已开启 ✓' : '未开启（系统未批准）';
      render();
      alert(ok ? '已开启。手机存储紧张时本应用数据会被优先保留。'
              : '系统未批准。建议把 App 添加到主屏幕后重试，并保持每两周导出一次备份。');
    }).catch(function(e){ alert('申请失败：'+e.message); });
  }
  else if(a==='importjson'){ importBackup(); }
  else if(a==='exportcsv'){ exportCSV(); }
  else if(a==='wipe'){
    if(!confirm('将清空所有宠物与记录，且无法恢复。建议先导出备份。确定继续？')) return;
    if(!confirm('再次确认：真的要清空全部数据吗？')) return;
    localStorage.removeItem(KEY); S.pets=[]; S.records=[]; load(); UI.tab='home'; render();
  }
}

var CHIP_MAP = {
  eaten:CN_TO_EATEN,

  kind:{'排便':'feces','尿酸':'urate','排便+尿酸':'both','未排泄':'none'},
  normal:{'正常':'yes','异常':'no'}

function bindFields(){
  $$('#f_fields .chips button').forEach(function(b){
    b.onclick = function(){
      var n=b.dataset.c, v=b.dataset.v;
      if(n==='sup'){
        var i=form.sup.indexOf(v);
        if(i>=0) form.sup.splice(i,1); else form.sup.push(v);
      }else if(n==='vet'){ form.vet = (v==='是'); }
      else if(n==='food'){ form.food = v; }
      else if(CHIP_MAP[n]){ form[n] = CHIP_MAP[n][v]; }
      else { form[n] = v; }
      syncForm();
    };
  });
  $$('#f_fields [data-s]').forEach(function(b){
    b.onclick = function(){
      var k=b.dataset.s, d=+b.dataset.d;
      form[k] = Math.max(0, (parseFloat(form[k])||0)+d);
      syncForm();
    };
  });
  var ids = ['weight','svl','size','symptom','medicine','hot','cool','humidity','text'];
  ids.forEach(function(k){
    var el = $('#f_'+k); if(!el) return;
    el.oninput = function(){ form[k] = el.value; };
  });

  $('#f_note').oninput = function(){ form.note = this.value; };

function saveRecord(){
  var v = {};
  if(form.type==='feed'){
    if(!form.food){ alert('请选择食物'); return; }
    v = {food:form.food, size:form.size, eaten:form.eaten, sup:form.sup.slice()};
  } else if(form.type==='weight'){
    var w=num(form.weight), s=num(form.svl);
    if(w==null && s==null){ alert('请填体重或体长'); return; }
    v = {weight:w, svl:s};
  } else if(form.type==='shed'){ v = {complete:form.complete||'unk'}; }
  else if(form.type==='poop'){ v = {kind:form.kind, normal:form.normal}; }
  else if(form.type==='health'){ if(!form.symptom){ alert('请填写症状或事项'); return; } v = {symptom:form.symptom, medicine:form.medicine, vet:form.vet}; }
  else if(form.type==='env'){ v = {hot:num(form.hot), cool:num(form.cool), humidity:num(form.humidity)}; if(v.hot==null&&v.cool==null&&v.humidity==null){alert('请至少填一项');return;} }
  else if(form.type==='breed'){ v = {event:form.event||'交配'}; }
  else if(form.type==='note'){ if(!form.text){ alert('请填写内容'); return; } v = {text:form.text}; }

  S.records.push({ id:uid(), petId:form.petId, type:form.type, date:form.date,
    time: pad(new Date().getHours())+':'+pad(new Date().getMinutes()),
    v:v, note:form.note, createdAt:Date.now() });
  save(); closeSheet(); render();
}

/* ---------- 头像处理 ----------
   目标：无论原图多大，都压到一张很小的方图，
   避免撑爆 localStorage（一般配额 5MB）。 */
var AV_SIZE = 144;      // 输出边长（显示最大 56px，144 足够清晰）
var AV_MAX  = 60000;    // base64 字符上限，约 45KB 实际体积

function compressAvatar(img){
  var side = Math.min(img.width, img.height);
  var sx = (img.width - side)/2, sy = (img.height - side)/2;
  var q = 0.72, out = '';
  for(var i=0;i<5;i++){
    var c = document.createElement('canvas');
    c.width = AV_SIZE; c.height = AV_SIZE;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,AV_SIZE,AV_SIZE);  // JPEG 无透明，补白底
    ctx.drawImage(img, sx, sy, side, side, 0, 0, AV_SIZE, AV_SIZE);
    out = c.toDataURL('image/jpeg', q);
    if(out.length <= AV_MAX) break;
    q -= 0.12;
    if(q < 0.3) q = 0.3;
  }
  return out;
}
/* 渲染头像预览 + 体积提示 */

    + '头像仅存本机，<b>不包含在备份文件中</b></div></div>';
}

/* 处理选中的图片文件（相册选择、拍照、拖拽共用） */
function handleAvatarFile(f){
  if(!f) return;
  if(f.size > 15*1024*1024){
    alert('图片过大（'+Math.round(f.size/1024/1024)+'MB），请选一张小一些的。');
    return;
  }
  setAvHint('处理中…');
  var rd = new FileReader();
  rd.onerror = function(){
    setAvHint('');
    alert('读取图片失败，请重试或换一张。');
  };
  rd.onload = function(){
    var img = new Image();
    img.onerror = function(){
      setAvHint('');
      alert('无法识别这个图片格式，请换一张 JPG / PNG。');
    };
    img.onload = function(){
      try{
        petForm.avatar = compressAvatar(img);
        renderAv();
      }catch(err){
        setAvHint('');
        alert('图片处理失败：'+(err && err.message ? err.message : err));
      }
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
}

function bindPet(){
  var map = {name:'p_name',morph:'p_morph',birth:'p_birth',acquire:'p_acquire',interval:'p_interval'};
  Object.keys(map).forEach(function(k){ var el=$('#'+map[k]); el.oninput=el.onchange=function(){ petForm[k]=el.value; }; });

  var rm = $('[data-p="rmav"]');

/* =========================================================
   导入导出（纯文本复制 / 粘贴，不产生任何文件读写）

   设计原则：备份与恢复完全不经过文件系统，只用「复制文本 / 粘贴文本」。
   这样在手机网页、手机 PWA、电脑浏览器、电脑 PWA 下行为完全一致，
   不受下载管理器与文件选择器限制的影响。

   全应用唯一的文件操作是「头像上传」，已单独做兼容处理。
   ========================================================= */

/* 选中文本域里的全部内容（iOS 需要 setSelectionRange 才能拉起全选） */
function selectAll(ta){
  try{
    ta.removeAttribute('readonly');
    ta.focus();
    if(ta.setSelectionRange) ta.setSelectionRange(0, ta.value.length);
    else ta.select();
    if(document.execCommand) { try{ document.execCommand('selectAll'); }catch(e){} }
  }catch(e){}
}
/* 复制到剪贴板：优先新 API，失败回退到 execCommand */
function copyText(text){
  return new Promise(function(resolve){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ resolve(true); })
        .catch(function(){ resolve(legacyCopy(text)); });
    }else{
      resolve(legacyCopy(text));
    }
  });
}
function legacyCopy(text){
  try{
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','readonly');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);       // 必须入 DOM，否则 iOS 选不中
    selectAll(ta);
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    try{ document.body.removeChild(ta); }catch(e){}
    return ok;
  }catch(e){ return false; }
}

/* 导出面板：显示可复制的文本 */
/* =========================================================
   备份文本编解码

   两种格式并存，导入时自动识别：
     compact —— 行式紧凑文本。一行一条记录，宠物用序号引用，
                体积最小，适合微信 / 备忘录传输。内容不可读，但信息完全等效。
     json    —— 标准 JSON。含完整字段名，便于人工查看、修改与迁移，但体积大。

   紧凑格式行定义：
     RC2|导出时间|宠物数|记录数
     P|名字|物种|品系|性别|出生|入手|喂食间隔
     TAG|日期|时间|宠物序号|备注|<类型专属字段…>
   尾部空字段会自动裁剪；字段内的 | 与换行用反斜杠转义。
   ========================================================= */
var BK_TAG = 'RC4';                  /* 当前写入版本 */
var BK_TAGS = ['RC4','RC3','RC2'];   /* 可解析版本：RC4 全压缩 / RC3 仅枚举 / RC2 纯文本 */
var D_EPOCH = Date.UTC(2020,0,1);    /* 日期基准点 */

/* ---------- 枚举编码表 ----------
   规则：只增不改、不重排。新增选项一律追加到末尾，
   这样旧备份里的代码在新版中含义不变。
   表里没有的值（用户自定义 / 未来新增）以 ~ 前缀原样存储。 */
var C_FOOD = {
  '果泥 CGD':'a','蟋蟀':'b','杜比亚':'c','面包虫':'d','樱桃蟑螂':'e','大麦虫':'f',
  '乳鼠·粉皮':'g','乳鼠·小白':'h','乳鼠·白霜':'i','乳鼠·亚成':'j','乳鼠·成鼠':'k',
  '油麦菜':'l','狗粮':'m','蜗牛':'n','蔬菜':'o','蓝舌粮':'p','角蛙粮':'q',
  '牧草':'r','龟粮':'s','蒲公英':'t','其他':'u'
};
var C_EATEN  = {'yes':'y','mostly':'m','partial':'p','no':'n'};
var C_SHED   = {'yes':'y','no':'n','unk':'u'};
var C_PKIND  = {'feces':'f','urate':'r','both':'b','none':'x'};
var C_NORMAL = {'yes':'y','no':'n'};
var C_EVENT  = {'交配':'a','产卵':'b','孵化':'c','拒食期':'d','其他':'e'};
var C_SPECIES= {'睫角守宫':'a','豹纹守宫':'b','玉米蛇':'c','球蟒':'d','鬃狮蜥':'e',
                '蓝舌石龙子':'f','角蛙':'g','苏卡达陆龟':'h','捕鸟蛛':'i','其他':'j'};
var C_GENDER = {'未知':'u','公':'m','母':'f'};
/* 添加剂用位掩码：一个数字表示多选组合 */
var B_SUP = {'钙粉':1,'D3':2,'维生素':4,'益生菌':8};

/* 反向表（供解码用） */
var R_FOOD={},R_EATEN={},R_SHED={},R_PKIND={},R_NORMAL={},R_EVENT={},R_SPECIES={},R_GENDER={};
(function(){
  function rev(src,dst){ for(var k in src) if(src.hasOwnProperty(k)) dst[src[k]]=k; }
  rev(C_FOOD,R_FOOD); rev(C_EATEN,R_EATEN); rev(C_SHED,R_SHED);
  rev(C_PKIND,R_PKIND); rev(C_NORMAL,R_NORMAL); rev(C_EVENT,R_EVENT);
  rev(C_SPECIES,R_SPECIES); rev(C_GENDER,R_GENDER);
})();

/* 编码：命中代码表就用代码，否则 ~ 前缀原样保存 */
function bkEnc(tbl, v){
  v = (v===null||v===undefined) ? '' : String(v);
  if(v==='') return '';
  var c = tbl[v];
  return (c!==undefined) ? c : ('~'+v);
}
/* 解码：~ 前缀为原样值，否则查表；代码不认识则退回原字符串 */
function bkDec(tbl, s, dflt){
  s = (s===null||s===undefined) ? '' : String(s);
  if(s==='') return dflt===undefined?'':dflt;
  if(s.charAt(0)==='~') return s.slice(1);
  var v = tbl[s];
  return (v!==undefined) ? v : s;
}
/* ---------- 日期 / 时间压缩 ----------
   日期：距 2020-01-01 的天数，36 进制（2026-09-17 → 1wd，约 3 字符）
   时间：当日分钟数，36 进制（11:30 → j6；空则留空）
   无法解析时用 ~ 前缀原样保存 */
function b36(n){ return (n<0?'-':'') + Math.abs(n).toString(36); }
function un36(s){
  if(!s) return NaN;
  var neg = s.charAt(0)==='-';
  var v = parseInt(neg ? s.slice(1) : s, 36);
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function encDate(ds){
  ds = (ds===null||ds===undefined) ? '' : String(ds);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return ds ? ('~'+ds) : '';
  var y=+ds.slice(0,4), m=+ds.slice(5,7), d=+ds.slice(8,10);
  if(m<1||m>12||d<1||d>31) return '~'+ds;
  return b36(Math.round((Date.UTC(y,m-1,d)-D_EPOCH)/86400000));
}
function decDate(c){
  c = (c===null||c===undefined) ? '' : String(c);
  if(!c) return '';
  if(c.charAt(0)==='~') return c.slice(1);
  var n = un36(c);
  if(isNaN(n)) return c;
  var t = new Date(D_EPOCH + n*86400000);
  var mm = t.getUTCMonth()+1, dd = t.getUTCDate();
  return t.getUTCFullYear()+'-'+(mm<10?'0':'')+mm+'-'+(dd<10?'0':'')+dd;
}
function encTime(ts){
  ts = (ts===null||ts===undefined) ? '' : String(ts);
  if(!ts) return '';
  var m = ts.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return '~'+ts;
  return b36((+m[1])*60 + (+m[2]));
}
function decTime(c){
  c = (c===null||c===undefined) ? '' : String(c);
  if(!c) return '';
  if(c.charAt(0)==='~') return c.slice(1);
  var n = un36(c);
  if(isNaN(n) || n<0 || n>=1440) return c;
  var h = Math.floor(n/60), mi = n%60;
  return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
}
function bkSupEnc(arr){
  if(!arr || !arr.length) return '';
  var m=0, ok=true;
  arr.forEach(function(x){ if(B_SUP[x]!==undefined) m|=B_SUP[x]; else ok=false; });
  if(!ok) return '~'+arr.join(',');
  return String(m);
}
function bkSupDec(s){
  s = (s===null||s===undefined) ? '' : String(s);
  if(!s) return [];
  if(s.charAt(0)==='~') return s.slice(1) ? s.slice(1).split(',') : [];
  var m=parseInt(s,10);
  if(isNaN(m)||m<=0) return [];
  var out=[];
  for(var k in B_SUP) if(B_SUP.hasOwnProperty(k) && (m & B_SUP[k])) out.push(k);
  return out;
}

function escField(s){
  s = (s===null || s===undefined) ? '' : String(s);
  return s.replace(/\\/g,'\\\\').replace(/\|/g,'\\|').replace(/\r/g,'').replace(/\n/g,'\\n');
}
function unescField(s){
  if(!s) return '';
  return s.replace(/\\n/g,'\n').replace(/\\\|/g,'|').replace(/\\\\/g,'\\');
}
/* 按未被反斜杠转义的 | 切分 */
function splitLine(line){
  var out=[], cur='', i=0;
  while(i<line.length){
    var c=line[i];
    if(c==='\\'){ cur += c + (line[i+1]||''); i+=2; continue; }
    if(c==='|'){ out.push(cur); cur=''; i++; continue; }
    cur += c; i++;
  }
  out.push(cur);
  return out;
}
function bkStr(v){ return (v===null||v===undefined) ? '' : String(v); }
function bkNum(v){ if(v===''||v===null||v===undefined) return null; var n=parseFloat(v); return isNaN(n)?null:n; }

/* 生成紧凑行式备份 */
function buildCompact(){
  var idx = {};
  S.pets.forEach(function(p,i){ idx[p.id]=i; });
  var L = [];
  L.push(BK_TAG+'|'+new Date().toISOString()+'|'+S.pets.length+'|'+S.records.length);
  S.pets.forEach(function(p){
    L.push(['P', bkStr(p.name), bkEnc(C_SPECIES,p.species), bkStr(p.morph), bkEnc(C_GENDER,p.gender),
            encDate(p.birth), encDate(p.acquire), bkStr(p.interval)].map(escField).join('|'));
  });
  S.records.slice().sort(function(a,b){
    return a.date<b.date?1:(a.date>b.date?-1:0);
  }).forEach(function(r){
    var v=r.v||{}, pi=idx[r.petId];
    if(pi===undefined) pi=0;
    var f;
    var rd = encDate(r.date), rt = encTime(r.time);
    if(r.type==='feed')        f=['F',rd,rt,pi,r.note,bkEnc(C_FOOD,v.food),bkStr(v.size),bkEnc(C_EATEN,v.eaten),bkSupEnc(v.sup)];
    else if(r.type==='weight') f=['W',rd,rt,pi,r.note,bkNum(v.weight),bkNum(v.svl)];
    else if(r.type==='shed')   f=['S',rd,rt,pi,r.note,bkEnc(C_SHED,v.complete)];
    else if(r.type==='poop')   f=['D',rd,rt,pi,r.note,bkEnc(C_PKIND,v.kind),bkEnc(C_NORMAL,v.normal)];
    else if(r.type==='health') f=['H',rd,rt,pi,r.note,bkStr(v.symptom),bkStr(v.medicine),v.vet?'1':''];
    else if(r.type==='env')    f=['E',rd,rt,pi,r.note,bkNum(v.hot),bkNum(v.cool),bkNum(v.humidity)];
    else if(r.type==='breed')  f=['B',rd,rt,pi,r.note,bkEnc(C_EVENT,v.event)];
    else                       f=['N',rd,rt,pi,r.note,bkStr(v.text)];
    // 裁剪尾部空字段（至少保留到备注位）
    while(f.length>4 && (f[f.length-1]===''||f[f.length-1]===null||f[f.length-1]===undefined)) f.pop();
    L.push(f.map(escField).join('|'));
  });
  return L.join('\n');
}

/* 生成 JSON 备份（不含头像） */
function buildJSON(pretty){
  var pets = S.pets.map(function(p){
    var c={};
    for(var k in p) if(Object.prototype.hasOwnProperty.call(p,k)) c[k]=p[k];
    c.avatar='';
    return c;
  });
  return JSON.stringify({
    version:1, exportedAt:new Date().toISOString(),
    note:'爬宠管家备份 · 不含头像', pets:pets, records:S.records
  }, null, pretty?1:0);
}

/* 解析紧凑行式备份 */
function parseCompact(text){
  var lines = text.split(/\r?\n/).map(function(l){ return l.replace(/\s+$/,''); })
                  .filter(function(l){ return l!==''; });
  if(!lines.length) throw new Error('内容为空');
  var ver = 2;                                  /* 2=纯文本 3=枚举 4=枚举+日期压缩 */
  if(lines[0].indexOf('RC4|')===0) ver=4;
  else if(lines[0].indexOf('RC3|')===0) ver=3;
  else if(lines[0].indexOf('RC2|')===0) ver=2;
  else throw new Error('不是受支持的备份格式');
  var isV3 = (ver>=3);
  var isV4 = (ver>=4);
  var head = splitLine(lines[0]);
  var declared = { pets: parseInt(head[2],10), records: parseInt(head[3],10) };
  var pets=[], ids=[], records=[];
  for(var i=1;i<lines.length;i++){
    var f = splitLine(lines[i]).map(unescField);
    var tag = f[0];
    if(tag==='P'){
      var id=uid(); ids.push(id);
      var sp = isV3 ? bkDec(R_SPECIES,f[2],'其他') : (f[2]||'其他');
      var gd = isV3 ? bkDec(R_GENDER,f[4],'未知') : (f[4]||'未知');
      pets.push({id:id, name:f[1]||'未命名', species:sp, morph:f[3]||'',
        gender:gd,
        birth: isV4?decDate(f[5]):(f[5]||''),
        acquire: isV4?decDate(f[6]):(f[6]||''),
        interval:parseInt(f[7],10)||3, avatar:'', createdAt:Date.now()});
      continue;
    }
    var date = isV4 ? (decDate(f[1])||today()) : (f[1]||today());
    var time = isV4 ? decTime(f[2]) : (f[2]||'');
    var pi=parseInt(f[3],10); if(isNaN(pi)) pi=0;
    var petId = ids[pi]!==undefined ? ids[pi] : (ids[0]!==undefined ? ids[0] : uid());
    var note=f[4]||'', v={}, type=null;
    if(tag==='F'){      type='feed';
                        v={ food: isV3?bkDec(R_FOOD,f[5],''):(f[5]||''),
                            size: f[6]||'',
                            eaten: isV3?bkDec(R_EATEN,f[7],'yes'):(f[7]||'yes'),
                            sup: isV3?bkSupDec(f[8]):(f[8]?f[8].split(','):[]) }; }
    else if(tag==='W'){ type='weight'; v={weight:bkNum(f[5]), svl:bkNum(f[6])}; }
    else if(tag==='S'){ type='shed';   v={complete: isV3?bkDec(R_SHED,f[5],'unk'):(f[5]||'unk')}; }
    else if(tag==='D'){ type='poop';   v={kind: isV3?bkDec(R_PKIND,f[5],'feces'):(f[5]||'feces'),
                                          normal: isV3?bkDec(R_NORMAL,f[6],'yes'):(f[6]||'yes')}; }
    else if(tag==='H'){ type='health'; v={symptom:f[5]||'', medicine:f[6]||'', vet:f[7]==='1'}; }
    else if(tag==='E'){ type='env';    v={hot:bkNum(f[5]), cool:bkNum(f[6]), humidity:bkNum(f[7])}; }
    else if(tag==='B'){ type='breed';  v={event: isV3?bkDec(R_EVENT,f[5],'交配'):(f[5]||'交配')}; }
    else if(tag==='N'){ type='note';   v={text:f[5]||''}; }
    else continue;
    records.push({id:uid(), petId:petId, type:type, date:date, time:time,
      v:v, note:note, createdAt:Date.now()});
  }
  return {pets:pets, records:records, declared:declared};
}

function showExportPanel(opt){
  var modes = [];
  if(opt.compact) modes.push({k:'compact', n:'紧凑格式（推荐）', v:opt.compact});
  if(opt.json)    modes.push({k:'json',    n:'JSON 格式',      v:opt.json});
  if(opt.content) modes.push({k:'raw',     n:'文本',           v:opt.content});
  if(!modes.length) return;
  var cur = 0;

  var h = '<h3>'+esc(opt.title)+'</h3>';
  h += '<div class="small muted" style="margin:6px 0 12px;line-height:1.8">'
     + (opt.desc || '复制下面的内容，粘贴到备忘录、微信文件助手或网盘里保存；恢复时在「导入备份」里粘贴回来即可。')
     + '</div>';

  if(modes.length>1){
    h += '<div class="seg" id="exp_seg" style="margin-bottom:10px">';
    modes.forEach(function(m,i){ h += '<button data-m="'+i+'" class="'+(i===0?'on':'')+'">'+m.n+'</button>'; });
    h += '</div>';
    h += '<div class="small" id="exp_hint" style="margin-bottom:10px;padding:9px 11px;background:var(--fill);border-radius:9px;line-height:1.7;color:var(--fg2)"></div>';
  }else if(opt.tip){
    h += '<div class="small" style="margin-bottom:10px;padding:9px 11px;background:var(--fill);border-radius:9px;line-height:1.7;color:var(--fg2)">'+opt.tip+'</div>';
  }

  h += '<textarea id="tp_text" readonly style="min-height:190px;font-size:11.5px;line-height:1.5">'+esc(modes[0].v)+'</textarea>';
  h += '<div class="row small muted" style="margin-top:8px"><span id="exp_len"></span><span id="exp_warn" style="color:var(--warn)"></span></div>';
  h += '<button class="btn" id="tp_copy" style="margin-top:12px">复制全部内容</button>';
  h += '<button class="btn gh" id="tp_done" style="margin-top:10px">完成</button>';
  sheet(h, true);

  var ta = document.getElementById('tp_text');
  var lenEl = document.getElementById('exp_len');
  var warnEl = document.getElementById('exp_warn');
  var hintEl = document.getElementById('exp_hint');

  function setMode(i){
    cur = i;
    ta.value = modes[i].v;
    var n = modes[i].v.length;
    if(lenEl) lenEl.textContent = '共 '+n+' 字符 · 约 '+Math.round(n/1024)+' KB';
    if(warnEl) warnEl.textContent = n>12000 ? '内容较长，可分次复制' : '';
    if(hintEl){
      if(modes[i].k==='compact' && opt.json){
        var pct = Math.max(0, Math.round((1 - opt.compact.length/opt.json.length)*100));
        hintEl.innerHTML = '一行一条记录，比 JSON 少约 <b>'+pct+'%</b> 字符。'
          + '内容不易直接阅读，但导入后完全等效，记录多时建议用它。';
      }else if(modes[i].k==='json'){
        hintEl.innerHTML = '含完整字段名，便于人工查看与修改，但体积明显更大。';
      }
    }
    var seg = document.getElementById('exp_seg');
    if(seg){
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function(b){
        b.className = (+b.getAttribute('data-m')===i) ? 'on' : '';
      });
    }
  }
  var segEl = document.getElementById('exp_seg');
  if(segEl){
    Array.prototype.forEach.call(segEl.querySelectorAll('button'), function(b){
      b.onclick = function(){ setMode(+b.getAttribute('data-m')); };
    });
  }
  setMode(0);

  document.getElementById('tp_copy').onclick = function(){
    selectAll(ta);
    copyText(modes[cur].v).then(function(ok){
      if(!ok){
        alert('自动复制没成功。请手动长按（或全选）上方文本框复制内容。');
      }else{
        var b = document.getElementById('tp_copy');
        if(b){ b.textContent = '已复制 ✓'; setTimeout(function(){ b.textContent = '复制全部内容'; }, 1800); }
      }
      opt.afterCopy && opt.afterCopy();
    });
  };
  document.getElementById('tp_done').onclick = function(){ closeSheet(); };
}

/* ---------- 导出：CSV 表格 ---------- */
function exportCSV(){
  var nameMap = {}; S.pets.forEach(function(p){ nameMap[p.id] = p.name; });
  var rows = [['日期','时间','宠物','类型','内容','进食情况','备注']];
  S.records.slice().sort(function(a,b){ return a.date<b.date?1:-1; }).forEach(function(r){
    var v = r.v || {};
    var content = [v.food, v.size, v.weight!=null?v.weight+'g':null, v.svl?v.svl+'cm':null,
                   v.symptom, v.event, v.text].filter(Boolean).join(' ');
    var eaten = (r.type==='feed' && v.eaten) ? (EATEN_TO_CN[v.eaten]||'') : '';
    rows.push([r.date, r.time||'', nameMap[r.petId]||'', TYPE_MAP[r.type]?TYPE_MAP[r.type].n:r.type, content, eaten, r.note||'']);
  });
  var csv = '\ufeff' + rows.map(function(r){
    return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(',');

  showExportPanel({
    title: '导出 CSV（复制文本）',

    desc: '复制后粘贴到 Excel、Numbers 或记事本即可查看。'
  });
}

/* ---------- 导入：自动识别格式并应用 ---------- */
function applyImport(text){
  try{
    var t = String(text).replace(/^\s+/,'');
    if(!t) throw new Error('内容为空');
    var d, fmt;
    if(t.indexOf('RC4|') === 0){            // 紧凑行式（枚举 + 日期压缩）
      d = parseCompact(t); fmt = '紧凑格式';
    }else if(t.indexOf('RC3|') === 0){      // 紧凑行式（仅枚举编码）
      d = parseCompact(t); fmt = '紧凑格式（RC3）';
    }else if(t.indexOf('RC2|') === 0){      // 紧凑行式（旧版纯文本）
      d = parseCompact(t); fmt = '紧凑格式（RC2）';
    }else{                                   // JSON（含旧版备份）
      d = JSON.parse(t);
      fmt = 'JSON 格式';
      if(!d || !d.pets || !d.records) throw new Error('缺少必要字段');
    }
    // 完整性校验：声明数量与实到数量不符，多半是复制时被截断了
    if(d.declared){
      var dp = d.declared.pets, dr = d.declared.records;
      var badP = (isNaN(dp) ? false : dp !== d.pets.length);
      var badR = (isNaN(dr) ? false : dr !== d.records.length);
      if(badP || badR){
        if(!confirm('⚠ 内容似乎不完整\n\n'
          + '文件声明有 '+dp+' 只宠物、'+dr+' 条记录，\n'
          + '实际只读到 '+d.pets.length+' 只、'+d.records.length+' 条。\n\n'
          + '通常是复制时被截断了。继续导入会丢失没读到的部分，建议先取消并重新完整复制。\n\n'
          + '确定仍要导入吗？')) return;
      }
    }

    if(!confirm('识别为'+fmt+'：'+d.pets.length+' 只宠物、'+d.records.length+' 条记录。\n\n确定导入？将覆盖当前全部数据。')) return;

    // 备份不含头像，尽量沿用本机已有的（先按 id，再按名字兜底）
    var avById = {}, avByName = {};
    S.pets.forEach(function(p){
      if(!p.avatar) return;
      avById[p.id] = p.avatar;
      if(p.name) avByName[p.name] = p.avatar;
    });
    var kept = 0, none = 0;
    d.pets.forEach(function(p){
      if(p.avatar) return;
      if(avById[p.id]){ p.avatar = avById[p.id]; kept++; }
      else if(p.name && avByName[p.name]){ p.avatar = avByName[p.name]; kept++; }
      else { p.avatar = ''; none++; }
    });

    S.pets = d.pets; S.records = d.records;
    UI.petId = S.pets[0] ? S.pets[0].id : null;
    markBackedUp();
    save(); render();
    var tip = '导入成功（'+fmt+'）';
    if(kept) tip += '\n\n已保留本机已有的 '+kept+' 张头像。';
    if(none) tip += (kept?'':'\n\n') + '有 '+none+' 只宠物没有头像，可在档案里重新设置。';
    alert(tip);
  }catch(e){
    alert('没能识别出备份内容。\n\n请确认粘贴的是完整备份文本 —— '
        + '紧凑格式以 RC2| / RC3| / RC4| 开头，JSON 以 { 开头，中间没有被截断或插入其他文字。');
  }
}
function importBackup(){ showImportPanel(); }

/* ---------- 启动 ---------- */
window.onerror = function(msg, src, line){
  showErr('脚本出错（第 '+line+' 行）：'+msg+'　—　请截图这个提示反馈。');
  return false;
};
try{
  load();
  applyUrlIntent();   // 处理桌面快捷方式带过来的参数
  render();
  initStorageGuard(); // 申请持久化存储 + 统计占用（异步，不阻塞界面）
}catch(e){
  showErr('初始化失败：'+e.message);
  document.getElementById('view').innerHTML =
    '<div class="page"><div class="hd"><h1>爬宠管家</h1></div>'
    + '<div class="empty">初始化失败：'+esc(e.message)+'<br><br>请尝试换用 Chrome / Edge 最新版打开。</div></div>';
}

/* ---------- 桌面快捷方式意图 ----------
   支持 index.html?a=add（直接弹出记录表单）和 ?t=stat（打开统计页） */
function applyUrlIntent(){
  try{
    var q = location.search.replace(/^\?/,'');
    if(!q) return;
    var p = {};
    q.split('&').forEach(function(kv){
      var a = kv.split('='); p[decodeURIComponent(a[0])] = decodeURIComponent(a[1]||'');
    });
    if(p.t && ['home','log','stat','mine'].indexOf(p.t)>=0) UI.tab = p.t;
    if(p.a === 'add') setTimeout(function(){ openForm('feed'); }, 260);
  }catch(e){}
}

/* ---------- Service Worker 注册 ----------
   只在 https / localhost 下注册。本地 file:// 打开时静默跳过，功能不受影响 */
if('serviceWorker' in navigator && /^(https?:)$/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      // 发现新版本时自动接管，避免用户一直用旧缓存
      reg.addEventListener('updatefound', function(){
        var nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', function(){
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            reg.waiting && reg.waiting.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }).catch(function(err){
      // 注册失败（比如 file:// 或不支持）不影响应用本身
      if(window.console) console.warn('SW 注册失败：', err && err.message);
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    // 新版本接管后刷新一次，保证用到最新代码
    try{
      if(!sessionStorage.getItem('sw_reloaded')){
        sessionStorage.setItem('sw_reloaded','1');
        location.reload();
      }
    }catch(e){ /* sessionStorage 不可用时忽略 */ }
  });
}
})();
</script>
